services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_PORT: 4000
      ENABLE_HTTPS: ${ENABLE_HTTPS}
      APP_HTTPS_PORT: 4443
      SSL_CERT_PATH: ${SSL_CERT_PATH}
      SSL_KEY_PATH: ${SSL_KEY_PATH}
      TRUST_PROXY: ${TRUST_PROXY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS}
      LOGIN_LOCKOUT_STAGES_MINUTES: ${LOGIN_LOCKOUT_STAGES_MINUTES}
      LOGIN_RATE_LIMIT_PER_IP: ${LOGIN_RATE_LIMIT_PER_IP}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME}
      APP_AUTHOR: ${APP_AUTHOR}
      APP_VERSION: ${APP_VERSION}
      APP_RELEASE_DATE: ${APP_RELEASE_DATE}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      # Certyfikaty montowane tylko gdy ENABLE_HTTPS=true (patrz .env.example)
      - certs:/certs:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  # --- Samodzielny reverse proxy (bez NGINX Proxy Managera) ---
  # Opcjonalne usługi, WYŁĄCZONE domyślnie (profil `standalone-proxy`), żeby
  # nie kolidować z portami 80/443 na wdrożeniach, które i tak stawiają NGINX
  # Proxy Managera obok (dom/VPS — patrz README.md). Uruchamiasz je tylko
  # jawnie: `docker compose --profile standalone-proxy up -d`.
  # Robią dokładnie to, co w wariancie z NPM robi Proxy Host + Custom
  # Location "/api" -> backend:4000: jedna domena, TLS z Let's Encrypt,
  # / -> frontend, /api -> backend. Zobacz też deploy/nginx/init-letsencrypt.sh
  # (jednorazowe pierwsze wystawienie certyfikatu).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["standalone-proxy"]
    depends_on:
      - backend
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/letsencrypt-data/conf:/etc/letsencrypt:ro
      - ./deploy/nginx/letsencrypt-data/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    profiles: ["standalone-proxy"]
    volumes:
      - ./deploy/nginx/letsencrypt-data/conf:/etc/letsencrypt
      - ./deploy/nginx/letsencrypt-data/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  mysql-data:
  certs:
