# Podmienia domyślny plik obrazu nginx:alpine (/etc/nginx/conf.d/default.conf,
# strona powitalna "Welcome to nginx!" na porcie 80 pod dowolnym Hostem).
# Bez tego appka byłaby widoczna pod dwoma "adresami" na porcie 80: pod
# poprawnym Hostem (APP_DOMAIN) przez nasz app.conf.template, a pod każdym
# innym Hostem (skanery, gołe IP, literówki w domenie) przez tę domyślną
# stronę — nieszkodliwe, ale niepotrzebnie ujawnia, że to nginx, i miesza
# w logach. Ten plik celowo nie definiuje żadnego serwera.
